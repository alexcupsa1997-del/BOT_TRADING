[package]
name = "engine"
version = "0.1.0"
edition = "2021"

[dependencies]
rust_decimal = { version = "1.33", features = ["serde-with-str", "macros", "maths"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
rust_decimal_macros = "1.40.0"
sha2 = "0.10.9"
hex = "0.4.3"
serde_json = "1.0.149"
parquet = "52.0.0"

[dev-dependencies]
proptest = "1.10.0"
tokio = { version = "1.35", features = ["full"] }
