version: '3.8'

services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "5555:5555"
    volumes:
      - ./data:/app/data
    networks:
      - trading-net
    restart: always

  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    volumes:
      - ./data:/app/data
    depends_on:
      - gateway
    networks:
      - trading-net
    restart: on-failure

  analysis:
    build:
      context: ./analysis
      dockerfile: Dockerfile
    volumes:
      - ./data:/app/data
    depends_on:
      - gateway
    networks:
      - trading-net
    command: python -c "import time; key='KEEP_ALIVE'; [time.sleep(3600) for _ in iter(int, 1)]" # Better keep-alive
    tty: true

  watchdog:
    image: alpine:latest
    depends_on:
      - gateway
      - engine
    command: sh -c "while true; do if ! nc -z gateway 8080; then echo 'Gateway down!'; fi; sleep 10; done"
    networks:
      - trading-net


networks:
  trading-net:
    driver: bridge
